LABEL arch_nbd
TEXT HELP
Boot the KickOS Arch Edition live environment using NBD.
It allows you to try KickOS, install it, or perform system maintenance.
ENDTEXT
MENU LABEL KickOS Arch Edition (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} quiet splash cms_verify=y
SYSAPPEND 3

